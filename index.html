<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Court Scoreboard</title>
<meta name="theme-color" content="#07111f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Court Score">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#07111f;--card:#10233a;--line:#28415d;--text:#f5f7fb;--muted:#9fb2c9;--accent:#47d7ac;--yellow:#ffd166;--red:#ff6b6b;--tap:48px}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-width:280px;min-height:100vh;min-height:100dvh;overflow-x:hidden;background:linear-gradient(145deg,#07111f,#0b1a2d 60%,#07111f);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.app{width:100%;max-width:1080px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
header{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;min-width:0}
.brand{display:flex;gap:9px;align-items:center;min-width:0}.brand img{width:44px;height:44px;flex:0 0 auto}.brand div{min-width:0}.brand h1{font-size:20px;line-height:1.1;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:block;margin-top:3px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select,input{font:inherit}button{min-height:var(--tap);border:1px solid var(--line);background:#142a44;color:var(--text);border-radius:14px;padding:10px 14px;cursor:pointer;font-weight:750;touch-action:manipulation}button:active{transform:scale(.985)}button.primary{background:var(--accent);color:#052016;border-color:transparent}button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid rgba(71,215,172,.55);outline-offset:2px}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;margin-bottom:12px}.toolbar select{width:100%;min-width:0;min-height:var(--tap);background:#0c1c30;border:1px solid var(--line);color:var(--text);border-radius:14px;padding:10px 12px}
.scoreboard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;width:100%}.team{min-width:0;background:rgba(16,35,58,.94);border:1px solid var(--line);border-radius:22px;padding:16px;min-height:310px;display:grid;grid-template-rows:auto minmax(88px,1fr) auto auto auto;gap:9px;align-items:center}.team.serving{outline:3px solid var(--yellow);outline-offset:-1px}.team input{display:block;width:100%;min-width:0;font-size:21px;font-weight:800;text-align:center;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);padding:7px 4px;border-radius:0}.big{min-width:0;font-size:clamp(76px,16vw,150px);font-weight:900;line-height:.92;text-align:center;letter-spacing:-5px;overflow-wrap:anywhere}.sub{text-align:center;color:var(--muted);font-size:15px;font-weight:700;line-height:1.25;min-height:20px;overflow-wrap:anywhere}.team button{width:100%;min-width:0}.pointbtn{font-size:21px;background:var(--accent);color:#052016;border:0;padding:14px}.minus{background:#203751}
.info{margin-top:12px;background:rgba(16,35,58,.8);border:1px solid var(--line);border-radius:18px;padding:13px 14px;display:grid;gap:6px;line-height:1.35;overflow-wrap:anywhere}.info strong{color:var(--yellow)}.history{font-size:13px;color:var(--muted);max-height:92px;overflow:auto;-webkit-overflow-scrolling:touch}.winner{color:var(--accent);font-size:18px;font-weight:900}
.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:12px}.controls button{width:100%;min-width:0;padding-inline:8px}
details.settings-wrap{margin-top:12px;background:rgba(13,29,49,.82);border:1px solid var(--line);border-radius:16px;overflow:hidden}details.settings-wrap summary{min-height:var(--tap);display:flex;align-items:center;justify-content:space-between;list-style:none;padding:11px 14px;font-weight:800;cursor:pointer;touch-action:manipulation}details.settings-wrap summary::-webkit-details-marker{display:none}details.settings-wrap summary::after{content:"＋";color:var(--accent);font-size:20px}details.settings-wrap[open] summary::after{content:"−"}.settings{padding:0 12px 12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.settings label{min-width:0;background:#0d1d31;border:1px solid var(--line);border-radius:13px;padding:10px;color:var(--muted);font-size:14px}.settings input,.settings select{display:block;width:100%;min-width:0;margin-top:6px;background:#071522;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px;font-size:16px}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));width:max-content;max-width:calc(100vw - 24px);transform:translateX(-50%);background:#fff;color:#07111f;padding:12px 16px;border-radius:13px;font-weight:800;text-align:center;display:none;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media(max-width:720px){
 .app{padding-top:max(9px,env(safe-area-inset-top));padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));padding-bottom:max(22px,env(safe-area-inset-bottom))}
 header{margin-bottom:9px}.brand{gap:7px}.brand img{width:38px;height:38px}.brand h1{font-size:17px}.brand small{display:none}header #install{min-height:42px;padding:8px 11px;font-size:13px;white-space:nowrap}
 .toolbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;margin-bottom:9px}.toolbar select{grid-column:1/-1;min-height:46px;font-size:16px}.toolbar button{min-height:44px;padding:8px 6px;font-size:14px}
 .scoreboard{gap:7px}.team{border-radius:17px;padding:10px 8px;min-height:254px;grid-template-rows:auto minmax(72px,1fr) auto auto auto;gap:7px}.team.serving{outline-width:2px}.team input{font-size:17px;padding:5px 2px}.big{font-size:clamp(58px,20vw,92px);letter-spacing:-3px}.sub{font-size:12px;min-height:30px;display:flex;align-items:center;justify-content:center}.pointbtn{font-size:17px;padding:10px 4px;min-height:52px}.minus{font-size:13px;min-height:42px;padding:7px 3px}
 .info{margin-top:9px;border-radius:14px;padding:10px 11px;font-size:14px}.history{max-height:68px;font-size:12px}
 .controls{gap:7px;margin-top:9px}.controls button{font-size:13px;min-height:44px;padding:7px 4px}
 details.settings-wrap{margin-top:9px;border-radius:14px}details.settings-wrap summary{font-size:14px;padding:9px 11px}.settings{grid-template-columns:1fr 1fr;gap:7px;padding:0 8px 8px}.settings label{font-size:12px;padding:8px}.settings input,.settings select{font-size:16px;padding:8px}
}
@media(max-width:360px){
 .brand h1{font-size:15px}.brand img{width:34px;height:34px}header #install{font-size:12px;padding-inline:8px}
 .team{padding:8px 6px;min-height:238px}.team input{font-size:16px}.big{font-size:clamp(52px,19vw,70px)}.sub{font-size:11px}.pointbtn{font-size:15px}.controls button{font-size:12px}
}
@media(max-height:540px) and (orientation:landscape){
 .app{max-width:960px;padding-top:6px;padding-bottom:8px}header{margin-bottom:5px}.brand img{width:32px;height:32px}.brand h1{font-size:16px}.brand small{display:none}.toolbar{grid-template-columns:minmax(230px,1fr) auto auto;margin-bottom:6px}.toolbar select{grid-column:auto}.scoreboard{gap:8px}.team{min-height:190px;padding:8px 12px;grid-template-rows:auto minmax(54px,1fr) auto auto;gap:5px}.team .minus{position:absolute;opacity:0;pointer-events:none}.big{font-size:clamp(56px,12vw,86px)}.sub{min-height:18px}.pointbtn{min-height:46px;padding:7px}.info{margin-top:6px;padding:7px 10px}.history{display:none}.controls{margin-top:6px}.controls button{min-height:40px}details.settings-wrap{margin-top:6px}
}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><img src="icon.svg" alt=""><div><h1>Court Scoreboard</h1><small>Padel · Rally 21 · Badminton</small></div></div>
 <button id="install" class="primary" hidden>Install App</button>
</header>
<div class="toolbar">
 <select id="mode" aria-label="Pilih sistem skor"><option value="tennis">Padel — skor tenis</option><option value="rally">Padel — rally 21 servis</option><option value="badminton">Badminton — rally point 21</option></select>
 <button id="swap">Tukar sisi</button><button id="fullscreen">Layar penuh</button>
</div>
<div class="scoreboard">
 <section class="team" id="cardA"><input id="nameA" value="Tim A" aria-label="Nama Tim A"><div class="big" id="scoreA">0</div><div class="sub" id="subA"></div><button class="pointbtn" data-team="A">+ Poin</button><button class="minus" data-minus="A">− Koreksi</button></section>
 <section class="team" id="cardB"><input id="nameB" value="Tim B" aria-label="Nama Tim B"><div class="big" id="scoreB">0</div><div class="sub" id="subB"></div><button class="pointbtn" data-team="B">+ Poin</button><button class="minus" data-minus="B">− Koreksi</button></section>
</div>
<div class="info"><div id="status"></div><div id="detail"></div><div class="history" id="history"></div></div>
<div class="controls"><button id="undo">Undo</button><button id="serve">Ganti servis</button><button id="reset" style="color:var(--red)">Reset</button></div>
<details class="settings-wrap">
 <summary>Pengaturan pertandingan</summary>
 <div class="settings">
  <label>Format pertandingan<select id="bestof"><option value="3">Best of 3</option><option value="1">1 set/game</option></select></label>
  <label>Aturan deuce padel<select id="golden"><option value="1">Golden point</option><option value="0">Advantage</option></select></label>
  <label>Pemain A<input id="playersA" value="A1, A2"></label>
  <label>Pemain B<input id="playersB" value="B1, B2"></label>
 </div>
</details>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),clone=o=>JSON.parse(JSON.stringify(o));
const fresh=()=>({mode:'tennis',names:{A:'Tim A',B:'Tim B'},players:{A:['A1','A2'],B:['B1','B2']},serve:'A',sets:{A:0,B:0},games:{A:0,B:0},points:{A:0,B:0},tb:false,rallyCount:0,rally:{A:0,B:0},bad:{A:0,B:0},history:[],stack:[],finished:false,winner:null,bestof:3,golden:true});
let S;try{S={...fresh(),...JSON.parse(localStorage.getItem('court-scoreboard')||'{}')}}catch{S=fresh()}let deferredPrompt=null;
const tennisLabels=['0','15','30','40'];
function save(){localStorage.setItem('court-scoreboard',JSON.stringify(S))}
function snap(){S.stack.push(clone({...S,stack:[]}));if(S.stack.length>40)S.stack.shift()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1800)}
function wonMatch(team){S.finished=true;S.winner=team;toast(S.names[team]+' menang pertandingan')}
function requiredWins(){return S.bestof===1?1:2}
function addTennis(t){if(S.finished)return;snap();const o=t==='A'?'B':'A';if(S.tb){S.points[t]++;if(S.points[t]>=7&&S.points[t]-S.points[o]>=2){S.games[t]++;S.points={A:0,B:0};S.tb=false;finishSet(t)}else S.serve=(S.points.A+S.points.B)%2===1?o:t;log(t);return}
if(S.golden&&S.points.A===3&&S.points.B===3){S.games[t]++;S.points={A:0,B:0};afterGame(t);log(t);return}
if(S.points[t]<3){S.points[t]++}else if(S.points[t]===3&&S.points[o]<3){S.games[t]++;S.points={A:0,B:0};afterGame(t)}else if(S.points[t]===3&&S.points[o]===3){S.points[t]=4}else if(S.points[t]===4){S.games[t]++;S.points={A:0,B:0};afterGame(t)}else if(S.points[o]===4){S.points[o]=3}
log(t)}
function afterGame(t){S.serve=S.serve==='A'?'B':'A';const o=t==='A'?'B':'A';if(S.games[t]>=6&&S.games[t]-S.games[o]>=2)finishSet(t);else if(S.games.A===6&&S.games.B===6){S.tb=true;S.points={A:0,B:0}}}
function finishSet(t){S.sets[t]++;S.games={A:0,B:0};S.points={A:0,B:0};S.tb=false;if(S.sets[t]>=requiredWins())wonMatch(t)}
function rallyServer(){const a=S.players.A,b=S.players.B;const seq=[{team:'A',p:a[0],n:5},{team:'B',p:b[0],n:5},{team:'A',p:a[1],n:5},{team:'B',p:b[1],n:5},{team:'A',p:a[0],n:1}];let x=S.rallyCount;for(const q of seq){if(x<q.n)return q;x-=q.n}return seq[4]}
function addRally(t){if(S.finished||S.rallyCount>=21)return;snap();S.rally[t]++;S.rallyCount++;log(t);if(S.rallyCount===21){if(S.rally.A===S.rally.B){S.finished=true;S.winner=null;toast('Hasil seri setelah 21 servis')}else wonMatch(S.rally.A>S.rally.B?'A':'B')}}
function addBad(t){if(S.finished)return;snap();const o=t==='A'?'B':'A';S.bad[t]++;S.serve=t;log(t);if((S.bad[t]>=21&&S.bad[t]-S.bad[o]>=2)||S.bad[t]===30){S.sets[t]++;toast(S.names[t]+' memenangkan game');S.bad={A:0,B:0};if(S.sets[t]>=requiredWins())wonMatch(t)}}
function add(t){S.mode==='tennis'?addTennis(t):S.mode==='rally'?addRally(t):addBad(t);save();render()}
function log(t){S.history.unshift(`${new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})} · poin ${S.names[t]}`);S.history=S.history.slice(0,12)}
function minus(t){if(S.finished)return;snap();if(S.mode==='rally'){if(S.rally[t]>0){S.rally[t]--;S.rallyCount=Math.max(0,S.rallyCount-1)}}else if(S.mode==='badminton'){S.bad[t]=Math.max(0,S.bad[t]-1)}else{S.points[t]=Math.max(0,S.points[t]-1)}save();render()}
function reset(){if(!confirm('Reset seluruh pertandingan?'))return;const keep={mode:S.mode,names:S.names,players:S.players,bestof:S.bestof,golden:S.golden};S={...fresh(),...keep};save();render()}
function render(){S.names.A=$('#nameA').value||S.names.A;S.names.B=$('#nameB').value||S.names.B;$('#mode').value=S.mode;$('#bestof').value=S.bestof;$('#golden').value=S.golden?'1':'0';$('#playersA').value=S.players.A.join(', ');$('#playersB').value=S.players.B.join(', ');$('#cardA').classList.toggle('serving',S.serve==='A'&&S.mode!=='rally');$('#cardB').classList.toggle('serving',S.serve==='B'&&S.mode!=='rally');let a,b,sa='',sb='',st='',dt='';
if(S.mode==='tennis'){a=S.tb?S.points.A:(S.points.A===4?'AD':tennisLabels[S.points.A]);b=S.tb?S.points.B:(S.points.B===4?'AD':tennisLabels[S.points.B]);sa=`Set ${S.sets.A} · Game ${S.games.A}`;sb=`Set ${S.sets.B} · Game ${S.games.B}`;st=S.tb?'Tiebreak':`Servis: ${S.names[S.serve]}`;dt=`${S.golden?'Golden point':'Advantage'} · ${S.bestof===3?'Best of 3':'1 set'}`}
if(S.mode==='rally'){a=S.rally.A;b=S.rally.B;const q=rallyServer();sa=`${S.rallyCount}/21 rally`;sb=`Sisa ${21-S.rallyCount}`;st=S.rallyCount<21?`Server: ${q.p} (${q.team==='A'?S.names.A:S.names.B})`:'21 servis selesai';const used=[5,10,15,20,21].find(v=>S.rallyCount<v)||21;dt=`Jatah server saat ini: servis ${S.rallyCount+1} sampai ${used}`}
if(S.mode==='badminton'){a=S.bad.A;b=S.bad.B;sa=`Game ${S.sets.A}`;sb=`Game ${S.sets.B}`;st=`Servis: ${S.names[S.serve]} · sisi ${S.bad[S.serve]%2===0?'kanan':'kiri'}`;dt='21 poin, selisih 2; pada 29–29, poin ke-30 menang'}
$('#scoreA').textContent=a;$('#scoreB').textContent=b;$('#subA').textContent=sa;$('#subB').textContent=sb;$('#status').innerHTML=S.finished?(S.winner?`<span class="winner">${S.names[S.winner]} menang pertandingan</span>`:'<span class="winner">Pertandingan berakhir seri</span>'):`<strong>${st}</strong>`;$('#detail').textContent=dt;$('#history').innerHTML=S.history.map(x=>'• '+x).join('<br>');save()}
document.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>add(b.dataset.team));document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>minus(b.dataset.minus));
$('#mode').onchange=e=>{const m=e.target.value;if(S.mode!==m&&confirm('Ganti mode dan mulai skor baru?')){const keep={names:S.names,players:S.players,bestof:S.bestof,golden:S.golden};S={...fresh(),...keep,mode:m};render()}else e.target.value=S.mode};
$('#nameA').onchange=e=>{S.names.A=e.target.value||'Tim A';render()};$('#nameB').onchange=e=>{S.names.B=e.target.value||'Tim B';render()};
$('#playersA').onchange=e=>{const p=e.target.value.split(',').map(x=>x.trim()).filter(Boolean);S.players.A=[p[0]||'A1',p[1]||'A2'];render()};$('#playersB').onchange=e=>{const p=e.target.value.split(',').map(x=>x.trim()).filter(Boolean);S.players.B=[p[0]||'B1',p[1]||'B2'];render()};
$('#bestof').onchange=e=>{S.bestof=+e.target.value;save()};$('#golden').onchange=e=>{S.golden=e.target.value==='1';save();render()};
$('#serve').onclick=()=>{S.serve=S.serve==='A'?'B':'A';save();render()};$('#reset').onclick=reset;$('#undo').onclick=()=>{const prev=S.stack.pop();if(prev){const stack=S.stack;S={...prev,stack};save();render()}};
$('#swap').onclick=()=>{const n=S.names.A;S.names.A=S.names.B;S.names.B=n;const p=S.players.A;S.players.A=S.players.B;S.players.B=p;const swapObj=o=>{const v=o.A;o.A=o.B;o.B=v};swapObj(S.sets);swapObj(S.games);swapObj(S.points);swapObj(S.rally);swapObj(S.bad);S.serve=S.serve==='A'?'B':'A';$('#nameA').value=S.names.A;$('#nameB').value=S.names.B;render()};
$('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#install').hidden=false});$('#install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#install').hidden=true}else toast('Safari: Bagikan → Tambahkan ke Layar Utama')};window.addEventListener('appinstalled',()=>toast('Aplikasi berhasil dipasang'));
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
$('#nameA').value=S.names.A;$('#nameB').value=S.names.B;render();
</script>
</body>
</html>
